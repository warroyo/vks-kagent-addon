apiVersion: v2
name: kagent
description: >-
  kagent and its Agent Substrate runtime (gVisor sandboxes, egress gateway,
  pod-certificate identity) as one VKS addon release.
type: application
# The blog's constraint; Substrate needs pod certificates, served from 1.37. The
# -0 lets VKS builds such as v1.37.1+vmware.4-vkr.1 match.
kubeVersion: ">=1.37.0-0 <1.38.0-0"
home: https://github.com/warroyo/vks-kagent-addon
sources:
  - https://github.com/warroyo/vks-kagent-addon
  - https://github.com/kagent-dev/kagent
  - https://github.com/kagent-dev/substrate
version: 0.1.3
# The tag of the bootstrap image, ghcr.io/warroyo/vks-kagent-addon/bootstrap.
appVersion: "0.1.3"
dependencies:
  # kagent's fork of Agent Substrate: API, controller, IdP, router, egress,
  # credential provider and atelet. v1.0.0 is the version kagent v1.0.1 pins.
  - name: substrate
    version: 1.0.0
    repository: oci://ghcr.io/kagent-dev/substrate/helm
  # The pod certificate controller and its signers.
  - name: substrate-podcert
    version: 1.0.0
    repository: oci://ghcr.io/kagent-dev/substrate/helm
  - name: kagent
    version: 1.0.1
    repository: oci://ghcr.io/kagent-dev/kagent/helm
# The AddonConfigDefinition, from chart/addon-config-definition.yaml. Written
# by scripts/embed-acd.sh; keep this block last.
annotations:
  addons.kubernetes.vmware.com/addon-config-definition: 
