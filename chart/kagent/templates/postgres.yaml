# The one PostgreSQL that kagent and Substrate share, in the kagent namespace,
# as kagent's own `kagent install` deploys it. It is adapted from kagent's
# go/core/pkg/install/bundled_postgres.yaml (Apache-2.0, The Kagent Authors),
# which in turn follows Substrate's manifests/ate-install/postgres/postgres.yaml.
#
# Clients authenticate with pod certificates (hostssl ... cert), so there are
# no passwords. The server's own certificate is the ServiceDNS signer's, and its
# client CA is the postgres signer's; both signers run in the substrate-podcert
# subchart.
#
# Differences from kagent's manifest:
#   - the roles and schemas are created by a native sidecar, db-setup, that runs
#     both setup.sql scripts through the local socket. kagent's CLI does this
#     with `kubectl exec`; a post-install hook Job would deadlock with
#     helm-controller's wait, because ate-api-server and the kagent controller
#     are not Ready until the roles exist. The scripts are idempotent.
#   - the pod is Ready only when the roles exist.
#   - the storage size and class, the resources and the image come from values.
{{- $name := include "kagent-addon.postgresName" . }}
{{- $namespace := include "kagent-addon.kagentNamespace" . }}
{{- $storage := .Values.postgres.storageSize }}
{{- /* Application logins that the pg_hba.conf line admits. */}}
{{- $users := "kagent_owner_user,kagent_readwrite_user,substrate_owner_user,substrate_readwrite_user" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "kagent-addon.labels" . | nindent 4 }}
data:
  postgresql.conf: |
    listen_addresses = '*'
    ssl = on
    ssl_cert_file = '/run/postgres-tls/server.pem'
    ssl_key_file = '/run/postgres-tls/server.pem'
    ssl_ca_file = '/run/postgres.podcert.ate.dev/trust-bundle.pem'
    hba_file = '/etc/postgresql/pg_hba.conf'
  pg_hba.conf: |
    # Local socket access is limited to processes in this pod: health checks,
    # the db-setup sidecar and the tls-reloader sidecar.
    local all all trust
    # The setup user is local-only; application pods never receive it.
    hostssl all postgres all reject
    # Client certificate CNs must match the requested database username.
    hostssl kagent {{ $users }} all cert
  copy-tls.sh: |
    # PostgreSQL refuses a private key that has group or world access unless
    # it is root-owned, and the kubelet gives a projected pod certificate the
    # pod's fsGroup and the owner it chooses, so the projected file cannot be
    # relied on to pass. This copies the bundle (certificate chain and key) to
    # an emptyDir as a 0600 file owned by the database user, and PostgreSQL
    # reads that copy. mv makes the replacement atomic.
    set -eu
    SRC=/run/servicedns.podcert.ate.dev/credential-bundle.pem
    DST=/run/postgres-tls/server.pem
    cp "$SRC" "$DST.new"
    chmod 600 "$DST.new"
    mv "$DST.new" "$DST"
  reload-tls.sh: |
    # PostgreSQL reads its TLS files only at startup and on SIGHUP. The kubelet
    # replaces the projected pod certificate in place before it expires, so
    # this loop copies the new bundle (copy-tls.sh) and reloads the server
    # whenever a source file changes.
    set -eu
    trap 'exit 0' TERM INT

    CERT=/run/servicedns.podcert.ate.dev/credential-bundle.pem
    CA=/run/postgres.podcert.ate.dev/trust-bundle.pem
    reloaded=""
    while true; do
      current="$(sha256sum "$CERT" "$CA" /etc/postgresql/pg_hba.conf)"
      if [ "$current" != "$reloaded" ]; then
        sh /etc/postgresql/copy-tls.sh
        if psql -U "$POSTGRES_USER" -d postgres -Atc 'SELECT pg_reload_conf()' >/dev/null 2>&1; then
          reloaded="$current"
        fi
      fi
      sleep 60 &
      wait $!
    done
  # kagent's setup.sql followed by Substrate's, in one transaction. Both are
  # psql scripts that need the variables db-setup.sh passes.
  setup.sql: |
    BEGIN;
{{ .Files.Get "files/kagent-postgres-setup.sql" | indent 4 }}
{{ .Files.Get "files/substrate-postgres-setup.sql" | indent 4 }}
    COMMIT;
  db-setup.sh: |
    # Creates the kagent database when it is missing, then the kagent and
    # Substrate roles and schemas in it (Substrate uses the same database, with
    # its own schema), once the server
    # accepts TCP connections. Only the real server listens on TCP; the image's
    # temporary initialization server is socket-only. Logins have empty
    # passwords: they authenticate with certificates. The script is
    # idempotent, so a restart of this container is harmless.
    set -eu
    trap 'exit 0' TERM INT

    until nc -z 127.0.0.1 5432 && psql -U postgres -d postgres -Atc 'SELECT 1' >/dev/null 2>&1; do
      sleep 1
    done
    # The image creates POSTGRES_DB only on the first start of an empty data
    # directory. If that start was interrupted after initdb, later starts skip
    # initialization and the database never appears, so create it here.
    if ! psql -U postgres -d postgres -Atc "SELECT 1 FROM pg_database WHERE datname = 'kagent'" | grep -qx 1; then
      createdb -U postgres kagent
      echo "created database kagent"
    fi
    until psql --no-psqlrc --set=ON_ERROR_STOP=1 -U postgres -d kagent \
      --set=kagent_schema=kagent \
      --set=kagent_owner_role=kagent_owner \
      --set=kagent_owner_user=kagent_owner_user \
      --set=kagent_owner_password= \
      --set=kagent_readwrite_role=kagent_readwrite \
      --set=kagent_readwrite_user=kagent_readwrite_user \
      --set=kagent_readwrite_password= \
      --set=substrate_schema=substrate \
      --set=substrate_owner_role=substrate_owner \
      --set=substrate_owner_user=substrate_owner_user \
      --set=substrate_owner_password= \
      --set=substrate_readwrite_role=substrate_readwrite \
      --set=substrate_readwrite_user=substrate_readwrite_user \
      --set=substrate_readwrite_password= \
      -f /etc/postgresql/setup.sql; do
      echo "database setup failed; retrying in 5s" >&2
      sleep 5
    done
    echo "database setup complete"
    # Native sidecars restart when they exit, so stay up.
    while true; do
      sleep 3600 &
      wait $!
    done
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "kagent-addon.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.postgres.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "kagent-addon.labels" . | nindent 4 }}
    app.kubernetes.io/name: kagent
    app.kubernetes.io/component: database
spec:
  replicas: 1
  # One writer on a ReadWriteOnce volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kagent
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kagent
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: database
    spec:
      # Passes Pod Security `restricted`: UID 70 is the postgres user of the
      # alpine image, so initdb and the server run as it directly (the image's
      # entrypoint only switches user when it starts as root), and fsGroup
      # makes the data volume and the projected certificate writable and
      # readable by it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- include "kagent-addon.imagePullSecrets" . | nindent 6 }}
      initContainers:
      # Runs to completion first, so the key copy exists when PostgreSQL starts.
      - name: tls-init
        image: {{ include "kagent-addon.image" (list .Values.postgres.image .) }}
        securityContext:
          runAsUser: 70
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        command: [/bin/sh, /etc/postgresql/copy-tls.sh]
        volumeMounts:
        - name: config
          mountPath: /etc/postgresql
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: tls
          mountPath: /run/postgres-tls
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
      - name: tls-reloader
        restartPolicy: Always
        image: {{ include "kagent-addon.image" (list .Values.postgres.image .) }}
        securityContext:
          runAsUser: 70
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        env:
        - name: POSTGRES_USER
          value: postgres
        command: [/bin/sh, /etc/postgresql/reload-tls.sh]
        volumeMounts:
        - name: config
          mountPath: /etc/postgresql
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: postgres-ca
          mountPath: /run/postgres.podcert.ate.dev
          readOnly: true
        - name: tls
          mountPath: /run/postgres-tls
        - name: socket
          mountPath: /var/run/postgresql
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
      - name: db-setup
        restartPolicy: Always
        image: {{ include "kagent-addon.image" (list .Values.postgres.image .) }}
        securityContext:
          runAsUser: 70
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        command: [/bin/sh, /etc/postgresql/db-setup.sh]
        volumeMounts:
        - name: config
          mountPath: /etc/postgresql
        - name: socket
          mountPath: /var/run/postgresql
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
      containers:
      - name: postgresql
        image: {{ include "kagent-addon.image" (list .Values.postgres.image .) }}
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        env:
        - name: POSTGRES_DB
          value: kagent
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_HOST_AUTH_METHOD
          value: trust
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        args: ["-c", "config_file=/etc/postgresql/postgresql.conf"]
        ports:
        - name: postgresql
          containerPort: 5432
        # Ready only when the server listens on TCP (not the temporary
        # initialization server) and db-setup has created the application
        # logins, so the clients' retries start succeeding at the right time.
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - >-
              nc -z 127.0.0.1 5432 &&
              [ "$(psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc
              "SELECT count(*) FROM pg_roles WHERE rolname IN ('kagent_owner_user','kagent_readwrite_user','substrate_owner_user','substrate_readwrite_user')")" = 4 ]
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          {{- toYaml .Values.postgres.resources | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: config
          mountPath: /etc/postgresql
        - name: tls
          mountPath: /run/postgres-tls
          readOnly: true
        - name: postgres-ca
          mountPath: /run/postgres.podcert.ate.dev
          readOnly: true
        - name: socket
          mountPath: /var/run/postgresql
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ $name }}
      - name: config
        configMap:
          name: {{ $name }}
      - name: tls
        emptyDir: {}
      - name: servicedns
        projected:
          # Group-readable, so the fsGroup can read it whoever owns the file.
          defaultMode: 0640
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      - name: postgres-ca
        projected:
          sources:
          - clusterTrustBundle:
              signerName: postgres.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: socket
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "kagent-addon.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
  ports:
  - name: postgresql
    port: 5432
    targetPort: postgresql
---
# Connection strings. They hold no password: the logins authenticate with the
# certificates that the pod certificate projections place under
# /run/postgres.podcert.ate.dev. kagent verifies the server with the postgres
# signer's bundle, Substrate with the ServiceDNS bundle.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.kagent.database.postgres.ownerConnectionStringSecretRef.name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "kagent-addon.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.kagent.database.postgres.ownerConnectionStringSecretRef.key }}: postgresql://kagent_owner_user@{{ $name }}.{{ $namespace }}.svc:5432/kagent?sslmode=verify-full&sslrootcert=/run/postgres.podcert.ate.dev/trust-bundle.pem&sslcert=/run/postgres.podcert.ate.dev/kagent_owner_user.pem&sslkey=/run/postgres.podcert.ate.dev/kagent_owner_user.pem
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.kagent.database.postgres.readWriteConnectionStringSecretRef.name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "kagent-addon.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.kagent.database.postgres.readWriteConnectionStringSecretRef.key }}: postgresql://kagent_readwrite_user@{{ $name }}.{{ $namespace }}.svc:5432/kagent?sslmode=verify-full&sslrootcert=/run/postgres.podcert.ate.dev/trust-bundle.pem&sslcert=/run/postgres.podcert.ate.dev/kagent_readwrite_user.pem&sslkey=/run/postgres.podcert.ate.dev/kagent_readwrite_user.pem
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.substrate.postgres.readWriteConnectionStringSecretRef.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kagent-addon.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.substrate.postgres.readWriteConnectionStringSecretRef.key }}: postgresql://substrate_readwrite_user@{{ $name }}.{{ $namespace }}.svc:5432/kagent?sslmode=verify-full&sslrootcert=/run/servicedns.podcert.ate.dev/trust-bundle.pem&sslcert=/run/postgres.podcert.ate.dev/substrate_readwrite_user.pem&sslkey=/run/postgres.podcert.ate.dev/substrate_readwrite_user.pem
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.substrate.postgres.ownerConnectionStringSecretRef.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kagent-addon.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.substrate.postgres.ownerConnectionStringSecretRef.key }}: postgresql://substrate_owner_user@{{ $name }}.{{ $namespace }}.svc:5432/kagent?sslmode=verify-full&sslrootcert=/run/servicedns.podcert.ate.dev/trust-bundle.pem&sslcert=/run/postgres.podcert.ate.dev/substrate_owner_user.pem&sslkey=/run/postgres.podcert.ate.dev/substrate_owner_user.pem
