# A Supervisor administrator applies this once. The VKS addon manager reads
# the chart from the helm repository and creates the Addon kagent and an
# AddonRelease for each version in addonFilters. The chart ships its own
# AddonConfigDefinition (an annotation in Chart.yaml, read by VKS 3.8 and
# later), which derives the wiring between kagent and Substrate per cluster.
#
# After the AddonRepositoryInstall exists, the webhook allows only
# spec.addonFilters to change. To offer a new chart version, add it to
# addonFilters (and keep the old one while clusters still use it).
#
# The package-offerings annotation is required, and it cannot change after
# install, so it lists no versions.
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonRepository
metadata:
  name: kagent-oci-repo
  namespace: vmware-system-vks-public
  annotations:
    addons.kubernetes.vmware.com/package-offerings: |
      {"repositoryVersion":"1.0.0","packages":{"kagent":{"versions":[]}}}
spec:
  fetch:
    helmRepository:
      url: oci://ghcr.io/warroyo/vks-kagent-addon/charts
  addonFilters:
    - name: kagent
      versions: ["0.1.0", "0.1.1", "0.1.2"]
  targetRepositoryName: kagent-oci-repo
  version: "1.0.0"
---
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonRepositoryInstall
metadata:
  name: kagent-oci-repo-install
  namespace: vmware-system-vks-public
spec:
  addonRepositoryRef:
    name: kagent-oci-repo
    namespace: vmware-system-vks-public
